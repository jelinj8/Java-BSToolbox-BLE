# For Bliksoft-public/* repos (pull mirrors of GitHub): forces an immediate pull sync instead of
# waiting for Forgejo's periodic mirror interval, so a maven-snapshot-deploy.yml run can be
# triggered right after new GitHub commits land. Confirmed working: mirror sync followed by a
# successful -SNAPSHOT deploy.
#
# Needs a Forgejo API token with repo-write scope (NOT the same as ORG_PACKAGES_TOKEN, which is
# package-scoped only), set as the MIRROR_SYNC_TOKEN org secret on Bliksoft-public.

on:
  workflow_dispatch:

jobs:
  mirror-sync:
    runs-on: docker
    steps:
      - name: Trigger pull mirror sync
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.MIRROR_SYNC_TOKEN }}" \
            "https://${{ vars.REGISTRY_URL }}/api/v1/repos/${{ github.repository }}/mirror-sync"
