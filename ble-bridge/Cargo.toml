[package]
name = "ble-bridge"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
description = "BLE sidecar process for cz.bliksoft.java:common-java-utils-ble, driven over newline-delimited JSON on stdin/stdout"

[[bin]]
name = "ble-bridge"
path = "src/main.rs"

[dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
